[pytest]
# Опция для автоматического добавления флагов
addopts = -s -v
# Устанавливает правила для тестовых файлов
python_files = test_*.py
# Устанавливает правила для имен классов
python_classes = Test*
# Устанавливает правила для имен функций
python_functions = test_*

# Регистрируем кастомные маркировки
# Команда вывода всех зарегистрированных маркировок: python -m pytest --markers
markers =
    ui: Маркировка для UI автотестов
    smoke: Маркировка дял smoke-тестов
    slow: Маркировка для медленных тестов
    fast: Маркировка для быстрых тестов
    critical: Маркировка для критичных тестов
    regression: Маркировка для регрессионных тестов
    registration: Маркировка для тестов, связанных с регистрацией пользователей
    authorization: Маркировка для тестов, связанных с авторизацией пользователей
    dashboard: Маркировка для тестов, связанных с рабочей панелью
    courses:  Маркировка для тестов, связанных с разделом курсов